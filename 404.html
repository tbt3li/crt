<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Lahore High Court</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{
  --green:#0E3B2C; --green-2:#165240; --brass:#B48A3A; --brass-soft:#F3EAD3;
  --ink:#1B2521; --muted:#66746D; --line:#E1E7E3; --bg:#F4F6F5; --card:#fff;
}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
h1,h2,.brand{font-family:'Libre Baskerville',Georgia,serif}

.hero{background:var(--green);color:#fff;position:relative;overflow:hidden;padding:2.2rem 0 5.5rem}
.hero::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(90deg,var(--brass),#D8B566,var(--brass))}
.seal{width:60px;height:60px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;
  color:var(--brass);font-size:1.6rem;background:rgba(255,255,255,.05)}
.court{color:var(--brass);font-size:.95rem}

main{flex:1}
.panel{margin-top:-3.2rem;position:relative;z-index:2;background:var(--card);border-radius:14px;
  box-shadow:0 18px 40px -18px rgba(14,59,44,.35);border:1px solid var(--line);
  max-width:620px;margin-left:auto;margin-right:auto;padding:2.75rem 1.5rem;text-align:center}
.code{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:clamp(4.5rem,18vw,7.5rem);
  line-height:1;color:var(--green);display:inline-flex;align-items:center;gap:.05em}
.code .scale{width:.72em;height:.72em;border-radius:50%;background:var(--brass-soft);color:var(--brass);
  display:inline-grid;place-items:center;font-size:.6em;border:2px solid var(--brass)}
.panel h1{font-size:1.5rem;margin:1.25rem 0 .6rem}
.panel p{color:var(--muted);max-width:440px;margin:0 auto}
.path{display:inline-block;margin-top:1.1rem;padding:.35rem .8rem;background:#F8FAF9;border:1px solid var(--line);
  border-radius:8px;font-size:.82rem;color:var(--muted);max-width:100%;overflow-wrap:anywhere}

.btn-home{margin-top:1.75rem;background:var(--green);color:#fff;border:0;border-radius:10px;
  padding:.8rem 1.6rem;font-weight:600;transition:background .15s}
.btn-home:hover{background:var(--green-2);color:#fff}
.btn-home:focus-visible{outline:3px solid var(--brass);outline-offset:2px;color:#fff}

footer{color:var(--muted);font-size:.85rem;padding:2rem 0}
</style>
</head>
<body>

<header class="hero">
  <div class="container position-relative" style="z-index:1">
    <div class="d-flex align-items-center gap-3">
      <div class="seal"><i class="fa-solid fa-scale-balanced"></i></div>
      <div>
        <div class="brand fs-5">Lahore High Court</div>
        <div class="court">Official Documents</div>
      </div>
    </div>
  </div>
</header>

<main class="container px-3">
  <section class="panel" role="alert">
    <div class="code" aria-hidden="true">4<span class="scale"><i class="fa-solid fa-scale-unbalanced"></i></span>4</div>
    <h1>Page not found</h1>
    <p>The page you are looking for has been moved, renamed or does not exist. Check the address, or go back to the documents list.</p>
    <div class="path" id="path"></div>
    <div>
      <a href="https://lhcl.pages.dev/" class="btn btn-home"><i class="fa-solid fa-house me-2"></i>Go to home</a>
    </div>
  </section>
</main>

<footer class="container text-center">
  Lahore High Court, Lahore. If you think this is a mistake, contact the Establishment Branch.
</footer>

<script>
  /* Show the address that failed, so employees can report it. */
  document.getElementById('path').textContent = location.pathname + location.search;
</script>
</body>
</html>
